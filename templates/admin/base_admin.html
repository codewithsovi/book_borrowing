{% load static %}

<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="76x76" href="{% static 'admin/img/apple-icon.png' %}" />
  <link rel="icon" type="image/png" href="{% static 'admin/img/favicon.png' %}" />
  <title>Book Borrowing</title>
  <!--     Fonts and icons     -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <!-- Nucleo Icons -->
  <link href="{% static 'admin/css/nucleo-icons.css' %}" rel="stylesheet" />
  <link href="{% static 'admin/css/nucleo-svg.css' %}" rel="stylesheet" />
  <!-- Popper -->
  <script src="https://unpkg.com/@popperjs/core@2"></script>
  <!-- Main Styling -->
  <link href="{% static 'admin/css/argon-dashboard-tailwind.css' %}?v=1.0.1" rel="stylesheet" />
</head>

<body
  class="m-0 font-sans text-base antialiased font-normal dark:bg-slate-900 leading-default bg-gray-50 text-slate-500">
  <div class="absolute w-full bg-blue-500 dark:hidden min-h-75"></div>
  <!-- sidenav  -->
  {% include 'admin/component/sidebar.html' %}

  <!-- end sidenav -->

  <main class="relative h-full max-h-screen transition-all duration-200 ease-in-out xl:ml-68 rounded-xl">
    <!-- Navbar -->

    {% include 'admin/component/navbar.html' %}
    <!-- end Navbar -->

    <!-- cards -->
    <div class="w-full px-6 py-6 mx-auto flex flex-col justify-between" style="min-height: calc(100vh - 75px);">

      <div class="w-full flex-grow">
        {% block content %}
        {% endblock content %}
      </div>

      {% include 'admin/component/footer.html' %}

    </div>
    <!-- end cards -->
  </main>
</body>

<script src="{% static 'admin/js/plugins/chartjs.min.js' %}" async></script>
<script src="{% static 'admin/js/plugins/perfect-scrollbar.min.js' %}" async></script>
<script src="{% static 'admin/js/argon-dashboard-tailwind.js' %}?v=1.0.1" async></script>
<!-- AJAX Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</html>
